info:
  name: Get a season
  type: http
  seq: 2
  tags:
    - Seasons

http:
  method: GET
  url: "{{baseUrl}}/seasons/:seasonId"
  params:
    - name: seasonId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/seasons/:seasonId"
      method: GET
      params:
        - name: seasonId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "leagueId": "",
            "name": "",
            "state": "upcoming",
            "startsAt": "",
            "endsAt": ""
          }
  - name: 404 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/seasons/:seasonId"
      method: GET
      params:
        - name: seasonId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
