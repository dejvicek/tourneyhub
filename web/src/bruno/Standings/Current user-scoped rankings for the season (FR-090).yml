info:
  name: Current user-scoped rankings for the season (FR-090)
  type: http
  seq: 2
  tags:
    - Standings

http:
  method: GET
  url: "{{baseUrl}}/seasons/:seasonId/rankings"
  params:
    - name: seasonId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/seasons/:seasonId/rankings"
      method: GET
      params:
        - name: seasonId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "seasonId": "",
              "userId": "",
              "rank": 0,
              "points": 0,
              "matchesPlayed": 0
            }
          ]
  - name: 404 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/seasons/:seasonId/rankings"
      method: GET
      params:
        - name: seasonId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
