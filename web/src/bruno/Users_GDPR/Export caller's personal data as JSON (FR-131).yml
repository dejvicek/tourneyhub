info:
  name: Export caller's personal data as JSON (FR-131)
  type: http
  seq: 1
  tags:
    - Users_GDPR

http:
  method: GET
  url: "{{baseUrl}}/users/me/export"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/users/me/export"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 401 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/users/me/export"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
