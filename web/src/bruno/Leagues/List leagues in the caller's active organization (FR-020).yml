info:
  name: List leagues in the caller's active organization (FR-020)
  type: http
  seq: 1
  tags:
    - Leagues

http:
  method: GET
  url: "{{baseUrl}}/leagues"
  params:
    - name: cursor
      value: ""
      type: query
      description: Opaque cursor for pagination
      disabled: true
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/leagues"
      method: GET
      params:
        - name: cursor
          value: ""
          type: query
          description: Opaque cursor for pagination
          disabled: true
        - name: limit
          value: "20"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "organizationId": "",
                "name": "",
                "slug": "",
                "visibility": "public",
                "scoringSystemId": "",
                "ownerId": "",
