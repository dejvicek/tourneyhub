info:
  name: Create a league within the org (FR-020)
  type: http
  seq: 2
  tags:
    - Leagues

http:
  method: POST
  url: "{{baseUrl}}/leagues"
  body:
    type: json
    data: |-
      {
        "name": "",
        "visibility": "public",
        "scoringSystemId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/leagues"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "visibility": "public",
            "scoringSystemId": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "organizationId": "",
            "name": "",
            "slug": "",
            "visibility": "public",
            "scoringSystemId": "",
            "ownerId": "",
            "state": "active",
            "version": 0
          }
  - name: 401 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/leagues"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "visibility": "public",
            "scoringSystemId": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
