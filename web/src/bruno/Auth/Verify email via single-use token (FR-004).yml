info:
  name: Verify email via single-use token (FR-004)
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Verified
    request:
      url: "{{baseUrl}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 410 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": ""
          }
    response:
      status: 410
      statusText: Gone
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
