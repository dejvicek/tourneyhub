info:
  name: Request or complete a password reset (FR-005)
  type: http
  seq: 4
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/password-reset"
  body:
    type: json
    data: |-
      {
        "email": "",
        "token": "",
        "newPassword": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 202 Response
    description: Accepted (always 202 to avoid account enumeration)
    request:
      url: "{{baseUrl}}/auth/password-reset"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "token": "",
            "newPassword": ""
          }
    response:
      status: 202
      statusText: Accepted
      body:
        type: text
        data: ""
  - name: 429 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/auth/password-reset"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "token": "",
            "newPassword": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
