info:
  name: Create an organization; caller becomes OrgOwner (FR-150)
  type: http
  seq: 1
  tags:
    - Organizations

http:
  method: POST
  url: "{{baseUrl}}/organizations"
  body:
    type: json
    data: |-
      {
        "name": "",
        "slug": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/organizations"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "slug": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "slug": "",
            "ownerId": "",
            "state": "active",
            "plan": "",
            "version": 0
          }
  - name: 403 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/organizations"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "slug": ""
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
