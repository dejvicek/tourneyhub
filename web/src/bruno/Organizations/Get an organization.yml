info:
  name: Get an organization
  type: http
  seq: 3
  tags:
    - Organizations

http:
  method: GET
  url: "{{baseUrl}}/organizations/:orgId"
  params:
    - name: orgId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/organizations/:orgId"
      method: GET
      params:
        - name: orgId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "slug": "",
            "ownerId": "",
            "state": "active",
            "plan": "",
            "version": 0
          }
  - name: 404 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/organizations/:orgId"
      method: GET
      params:
        - name: orgId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
