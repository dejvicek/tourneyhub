info:
  name: List organizations the caller belongs to (FR-154)
  type: http
  seq: 2
  tags:
    - Organizations

http:
  method: GET
  url: "{{baseUrl}}/organizations"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/organizations"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "slug": "",
              "ownerId": "",
              "state": "active",
              "plan": "",
              "version": 0
            }
          ]
  - name: 401 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/organizations"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
