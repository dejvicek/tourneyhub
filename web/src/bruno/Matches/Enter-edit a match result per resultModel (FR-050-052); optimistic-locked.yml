info:
  name: Enter/edit a match result per resultModel (FR-050/052); optimistic-locked
  type: http
  seq: 1
  tags:
    - Matches

http:
  method: PATCH
  url: "{{baseUrl}}/matches/:matchId/result"
  headers:
    - name: If-Match
      value: ""
      description: Entity version/ETag for optimistic locking (NFR-023).
  params:
    - name: matchId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "winnerId": "",
        "scoreA": "",
        "scoreB": "",
        "isDraw": false,
        "isForfeit": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

