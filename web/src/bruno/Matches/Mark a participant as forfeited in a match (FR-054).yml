info:
  name: Mark a participant as forfeited in a match (FR-054)
  type: http
  seq: 2
  tags:
    - Matches

http:
  method: POST
  url: "{{baseUrl}}/matches/:matchId/forfeit"
  params:
    - name: matchId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "forfeitedParticipantId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

