info:
  name: Create a tournament, standalone or under a league season (FR-040/040a/040b)
  type: http
  seq: 2
  tags:
    - Tournaments

http:
  method: POST
  url: "{{baseUrl}}/tournaments"
  body:
    type: json
    data: |-
      {
        "leagueId": "",
        "seasonId": "",
        "disciplineName": "",
        "resultModel": "winner",
        "scoreConfig": {
          "minScore": 0,
          "maxScore": 0,
          "allowDraws": false
        },
        "teamSize": 0,
        "formatType": "SingleElimination",
        "resultEntryMode": "organizer",
        "bestOf": "",
        "entryFee": {
          "amountMinor": 0,
          "currency": "EUR"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/tournaments"
      method: POST
      body:
        type: json
        data: |-
          {
            "leagueId": "",
            "seasonId": "",
            "disciplineName": "",
            "resultModel": "winner",
            "scoreConfig": {
              "minScore": 0,
              "maxScore": 0,
              "allowDraws": false
            },
            "teamSize": 0,
            "formatType": "SingleElimination",
            "resultEntryMode": "organizer",
            "bestOf": "",
            "entryFee": {
              "amountMinor": 0,
              "currency": "EUR"
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "organizationId": "",
            "leagueId": "",
            "seasonId": "",
            "disciplineName": "",
            "resultModel": "winner",
            "teamSize": 0,
            "formatType": "SingleElimination",
            "resultEntryMode": "organizer",
            "state": "Draft",
            "rngSeed": "",
            "currency": "",
            "entryFee": {
              "amountMinor": 0,
              "currency": "EUR"
            },
            "version": 0
          }
  - name: 422 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/tournaments"
