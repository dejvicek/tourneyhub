              "allowDraws": false
            },
            "teamSize": 0,
            "formatType": "SingleElimination",
            "resultEntryMode": "organizer",
            "bestOf": "",
            "entryFee": {
              "amountMinor": 0,
              "currency": "EUR"
            }
