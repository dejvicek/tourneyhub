info:
  name: Assign seeds — random (stored rng_seed) or manual (FR-046)
  type: http
  seq: 4
  tags:
    - Tournaments

http:
  method: POST
  url: "{{baseUrl}}/tournaments/:tournamentId/seed"
  params:
    - name: tournamentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "method": "random",
        "order": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Seeded
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId/seed"
      method: POST
      params:
        - name: tournamentId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "method": "random",
            "order": []
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 409 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId/seed"
      method: POST
      params:
        - name: tournamentId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "method": "random",
            "order": []
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
