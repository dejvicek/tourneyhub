info:
  name: Get a tournament
  type: http
  seq: 3
  tags:
    - Tournaments

http:
  method: GET
  url: "{{baseUrl}}/tournaments/:tournamentId"
  params:
    - name: tournamentId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId"
      method: GET
      params:
        - name: tournamentId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "organizationId": "",
            "leagueId": "",
            "seasonId": "",
            "disciplineName": "",
            "resultModel": "winner",
            "teamSize": 0,
            "formatType": "SingleElimination",
            "resultEntryMode": "organizer",
            "state": "Draft",
            "rngSeed": "",
            "currency": "",
            "entryFee": {
              "amountMinor": 0,
              "currency": "EUR"
            },
            "version": 0
          }
  - name: 404 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId"
      method: GET
      params:
        - name: tournamentId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
