info:
  name: Register a participant (captain assembles roster if teamSize > 1) (FR-044)
  type: http
  seq: 1
  tags:
    - Registrations

http:
  method: POST
  url: "{{baseUrl}}/tournaments/:tournamentId/registrations"
  headers:
    - name: Idempotency-Key
      value: ""
      description: Prevents duplicate creates (FR-045).
      disabled: true
  params:
    - name: tournamentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "participantDisplayName": "",
        "rosterInviteEmails": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId/registrations"
      method: POST
      headers:
        - name: Idempotency-Key
          value: ""
          description: Prevents duplicate creates (FR-045).
          disabled: true
      params:
        - name: tournamentId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "participantDisplayName": "",
            "rosterInviteEmails": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "tournamentId": "",
            "participantId": "",
            "submittedByUserId": "",
            "state": "Pending",
            "seed": "",
            "paymentStatus": "none"
          }
  - name: 409 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/tournaments/:tournamentId/registrations"
      method: POST
      headers:
        - name: Idempotency-Key
          value: ""
          description: Prevents duplicate creates (FR-045).
          disabled: true
      params:
        - name: tournamentId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "participantDisplayName": "",
            "rosterInviteEmails": []
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
