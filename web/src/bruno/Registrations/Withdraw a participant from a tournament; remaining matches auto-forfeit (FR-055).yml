info:
  name: Withdraw a participant from a tournament; remaining matches auto-forfeit (FR-055)
  type: http
  seq: 2
  tags:
    - Registrations

http:
  method: POST
  url: "{{baseUrl}}/participants/:participantId/withdraw"
  params:
    - name: participantId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Withdrawn
    request:
      url: "{{baseUrl}}/participants/:participantId/withdraw"
      method: POST
      params:
        - name: participantId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "tournamentId": "",
            "participantId": "",
            "submittedByUserId": "",
            "state": "Pending",
            "seed": "",
            "paymentStatus": "none"
          }
  - name: 409 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/participants/:participantId/withdraw"
      method: POST
      params:
        - name: participantId
          value: ""
          type: path
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
  - name: 422 Response
    description: RFC 7807 Problem Details
    request:
      url: "{{baseUrl}}/participants/:participantId/withdraw"
      method: POST
      params:
        - name: participantId
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "traceId": "",
            "code": "unknown_error",
            "errors": {}
          }
