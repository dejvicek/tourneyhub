# The production images (ADR-004, ADR-014), used for the end-to-end tests. Both
# images are built locally today; the VPS waits for the GHCR images (ADR-014).
# Run it with `docker compose -f compose.yaml -f compose.prod.yaml`, or
# COMPOSE_FILE=compose.yaml:compose.prod.yaml in .env. compose.override.yaml is
# not loaded then, so the definitions here are complete.

services:
  api:
    build:
      context: ./backend
      target: runtime
    # Not the default tourneyhub-api, which is the development build.
    image: tourneyhub-api-runtime
    # Settings come only from the environment (docs/python-style.md §6).
    environment:
      TOURNEYHUB_ENV: production
      TOURNEYHUB_DATABASE_URL: ${TOURNEYHUB_DATABASE_URL:?set TOURNEYHUB_DATABASE_URL in .env}
      TOURNEYHUB_JWT_SECRET: ${TOURNEYHUB_JWT_SECRET:?set TOURNEYHUB_JWT_SECRET in .env}
      TOURNEYHUB_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    # Healthy once uvicorn listens, which it does only after the migrations,
    # the app factory and the app's startup. The image has Python but no
    # curl; a connection without a request leaves no access-log line, as an
    # HTTP probe every interval would.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    # No ports: only web reaches it, on the Compose network (ADR-005).

  # Caddy with the built frontend, the only service with host ports (ADR-005).
  web:
    build:
      context: ./frontend
      target: runtime
      # The image generates the API types from backend/openapi.json (ADR-008).
      additional_contexts:
        backend: ./backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # The redirect from HTTP names the published HTTPS port.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3
      - "${HTTPS_PORT:-443}:443/udp"
    # Certificates and the local CA survive a new container; on the VPS this
    # also keeps Let's Encrypt from issuing again at every update.
    volumes:
      - caddy-data:/data
    # Started once api accepts connections, so that /api never gets a 502
    # while the api is still migrating.
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy-data:
