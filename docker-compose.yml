# TourneyHub local infrastructure — Postgres + Redis + Mailpit.
# Usage: `docker compose up -d` (CLAUDE.md §4). The API, worker and web app run on the
# host (uv / npm) during development. Values default to .env.example credentials.

name: tourneyhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourneyhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourneyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourneyhub}
      POSTGRES_DB: ${POSTGRES_DB:-tourneyhub}
      # Consumed by db/init/01-roles.sql on first start.
      TOURNEYHUB_APP_DB_PASSWORD: ${TOURNEYHUB_APP_DB_PASSWORD:-tourneyhub_app}
      TOURNEYHUB_ADMIN_DB_PASSWORD: ${TOURNEYHUB_ADMIN_DB_PASSWORD:-tourneyhub_admin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates tourneyhub_app / tourneyhub_admin (DATA-MODEL.md §11.1). Runs once,
      # only when the data volume is empty — `docker compose down -v` to re-run.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourneyhub} -d ${POSTGRES_DB:-tourneyhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tourneyhub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tourneyhub-mailpit
    ports:
      - "1025:1025"   # SMTP (TOURNEYHUB_EMAIL_SMTP_PORT)
      - "8025:8025"   # Web UI — http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
