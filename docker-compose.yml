# TourneyHub local infrastructure — Postgres + Redis + Mailpit.
# Usage: `docker compose up -d`  (AGENTS.md §4). The API and web app run on the
# host (dotnet / npm), not in compose, during development.
# Values default to the same credentials as .env.example; override via a .env file.

name: tourneyhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourneyhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourneyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourneyhub}
      POSTGRES_DB: ${POSTGRES_DB:-tourneyhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourneyhub} -d ${POSTGRES_DB:-tourneyhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tourneyhub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tourneyhub-mailpit
    ports:
      - "1025:1025"   # SMTP (Smtp__Port)
      - "8025:8025"   # Web UI — http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
