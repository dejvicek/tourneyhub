name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or to main cancels the run it supersedes:
# GitHub Free has 2,000 Actions minutes a month (ADR-012).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path filter lives here, not under `on:`, so that ci-ok always reports (ADR-012).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # a push is compared with the commit before it
          persist-credentials: false
      - name: Find the changed areas
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request: its merge commit against the first parent, the branch it
          # merges into. A push: against the commit before the push. When that commit
          # is unknown (a new branch, a force push), every area counts as changed.
          if [ "$EVENT_NAME" = pull_request ]; then
            base=HEAD^1
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=
          fi
          # true when anything under the given paths changed
          changed() {
            if [ -z "$base" ] || [ -n "$(git diff --no-renames --name-only "$base" HEAD -- "$@")" ]; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "backend=$(changed backend .github/workflows)"
            # The frontend's API types come from backend/openapi.json (ADR-008).
            echo "frontend=$(changed frontend backend/openapi.json .github/workflows)"
            # The tests are in frontend/e2e; they run the images of both areas.
            echo "e2e=$(changed backend frontend compose.yaml compose.prod.yaml .github/e2e.env .github/workflows)"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 # DATA-MODEL §2
        # -h localhost: the entrypoint's first, temporary server listens only on its socket
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      TOURNEYHUB_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tourneyhub_test
      # pytest-alembic's tests empty this one before each test (docs/python-style.md §9)
      TOURNEYHUB_TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tourneyhub_test_migrations
      # Settings for `alembic upgrade head` and `alembic check`
      TOURNEYHUB_ENV: development
      TOURNEYHUB_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tourneyhub_dev
      # Not a real secret: a dummy of 48 characters, because Settings require one
      TOURNEYHUB_JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      # Through psycopg, not docker exec into the service: act, which runs this workflow
      # locally, leaves job.services empty, so the container id is unknown there.
      - name: Create the databases
        run: |
          uv run python - <<'EOF'
          import psycopg
          from psycopg import sql

          url = "postgresql://postgres:postgres@localhost:5432/postgres"
          with psycopg.connect(url, autocommit=True) as conn:
              for name in ("tourneyhub_test", "tourneyhub_test_migrations", "tourneyhub_dev"):
                  conn.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(name)))
          EOF
      - run: uv run python -VV # from .python-version (3.15); uv 0.13.7 installs 3.15.2
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - name: Engine coverage 100 %
        run: uv run coverage report --include="*/tourneyhub/engine/*" --fail-under=100
      - name: Export openapi.json
        run: uv run python -W error -m tourneyhub.openapi > openapi.json
      - name: openapi.json drift
        run: git diff --exit-code openapi.json
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv audit --preview-features audit-command

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm before Node, whose pnpm cache needs it: Node 25 and later ship no
      # Corepack (ADR-003). The version comes from packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The API types from the committed backend/openapi.json (ADR-008)
      - run: pnpm generate:api
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Playwright against the production images behind Caddy (ADR-013).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every `docker compose` below runs compose.yaml with compose.prod.yaml and
      # reads the dummy configuration in .github/e2e.env instead of a .env.
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      COMPOSE_ENV_FILES: .github/e2e.env
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      # --wait returns once db and api are healthy and web runs; web starts only
      # after the api's healthcheck passes.
      - name: Build and start the production stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - run: pnpm e2e
        working-directory: frontend
      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color
      - name: Upload the traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/e2e/test-results/
          retention-days: 7 # ADR-012, ADR-013
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The one check to require (ADR-012): it fails when a needed job failed or was
  # cancelled, and passes when a job was skipped because nothing in its area changed.
  ci-ok:
    needs: [changes, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
