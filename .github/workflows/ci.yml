name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend: build + unit/integration tests (mirrors AGENTS.md §8 DoD) ----
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tourneyhub
          POSTGRES_PASSWORD: tourneyhub
          POSTGRES_DB: tourneyhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tourneyhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=tourneyhub;Username=tourneyhub;Password=tourneyhub"
      ConnectionStrings__Redis: "localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Apply EF Core migrations against the CI Postgres to prove they work (AGENTS.md §8).
      - name: Install EF Core tool
        run: dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
      - name: Apply EF migrations
        run: dotnet ef database update --project src/TourneyHub.Infrastructure --startup-project src/TourneyHub.Api --connection "$ConnectionStrings__Postgres"
      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal
      # Security: fail on high/critical vulnerable packages (NFR-021).
      - name: Audit NuGet packages for vulnerabilities
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -qi 'critical\|high' vulnerability-report.txt; then
            echo "::error::Critical or high severity NuGet vulnerabilities found"
            exit 1
          fi
          echo "No critical/high severity NuGet vulnerabilities."

  # ---- Frontend: typecheck + lint + build (contract-typed client) ----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Security: fail on high/critical npm vulnerabilities.
      - name: npm audit
        run: npm audit --audit-level=high

  # ---- Contract: OpenAPI must lint clean ----
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  # ---- Secret scanning: never committed secrets (NFR-021) ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}