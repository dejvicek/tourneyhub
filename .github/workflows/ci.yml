name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend: build + unit/integration tests (mirrors AGENTS.md §8 DoD) ----
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tourneyhub
          POSTGRES_PASSWORD: tourneyhub
          POSTGRES_DB: tourneyhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tourneyhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=tourneyhub;Username=tourneyhub;Password=tourneyhub"
      ConnectionStrings__Redis: "localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  # ---- Frontend: typecheck + lint + build (contract-typed client) ----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # ---- Contract: OpenAPI must lint clean ----
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli@latest lint api/openapi.yaml
