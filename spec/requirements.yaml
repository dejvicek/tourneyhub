# TourneyHub — Requirements Traceability Index
# ---------------------------------------------------------------------------
# Machine-readable coverage tracker. Source of truth for the requirement text
# is PRD.md; this file tracks IMPLEMENTATION coverage. As you build a slice
# (AGENTS.md §6), update each touched requirement:
#   status: not_started | in_progress | done | deferred
#   files:  [ relative paths implementing it ]
#   tests:  [ relative paths proving it ]
# Keep IDs identical to PRD.md. Do not delete requirements; mark deferred.
