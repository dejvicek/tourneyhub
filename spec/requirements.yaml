# TourneyHub — Requirements Traceability Index (MVP)
# ---------------------------------------------------------------------------
# Machine-readable coverage tracker. Requirement TEXT lives in PRD.md; this file
# tracks IMPLEMENTATION coverage. When you work a slice (CLAUDE.md §8) update:
#   status: not_started | in_progress | done | deferred
#   files:  [ relative paths implementing it ]
#   tests:  [ relative paths proving it ]
# Keep IDs identical to PRD.md. Do not delete requirements; mark deferred.
# Non-MVP requirement IDs live in ROADMAP.md §4 and are NOT listed here.
# ---------------------------------------------------------------------------
meta:
